# LinguaIME schema using the unmodified Rime pinyin-simp dictionary.
# Keyboard routing, punctuation, candidate UI and persistent learning belong to the host.
schema:
  schema_id: lingua_pinyin
  name: LinguaIME 简体拼音
  version: '1.0'
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
translator:
  dictionary: pinyin_simp
  enable_sentence: true
  enable_completion: true
  # A shared SQLite store handles learning across host processes. LevelDB permits
  # only one writer, so it must not be opened separately in every Windows app.
  enable_user_dict: false
  always_show_comments: true
  spelling_hints: 128
