[workspace]
members = ["crates/ime-types", "crates/ime-core", "crates/ime-rime", "crates/ime-storage", "crates/ime-ffi", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ime-types = { path = "crates/ime-types" }
ime-core = { path = "crates/ime-core" }
ime-storage = { path = "crates/ime-storage" }
ime-rime = { path = "crates/ime-rime" }

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
